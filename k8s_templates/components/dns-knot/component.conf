# Описание компонента dns-knot для конструктора k8s_templates.
# Группы шаблонов и условия их включения в сборку.
#
# Имена групп — просто логические секции; build.sh читает этот файл и
# рендерит шаблоны из каждой группы, чьё условие (СOND_*) выполнено.

COMPONENT=dns-knot
DESCRIPTION="Knot DNS (primary + secondary) и dnsadmin (веб-UI управления зонами), опционально DNS01 через cert-manager"

# Шаблоны, которые рендерятся всегда
BASE_TEMPLATES=templates

# Шаблоны secondary: рендерятся на каждую вторичку из SECONDARY_NODES
SECONDARY_TEMPLATES=templates/secondary
SECONDARY_COND=SECONDARY_NODES

# Шаблоны cert-manager (DNS01): рендерятся, если DNS01=yes
CERT_MANAGER_TEMPLATES=templates/cert-manager
CERT_MANAGER_COND=DNS01

# Каталог zone-файлов внутри компонента (имя файла = имя зоны)
ZONES_DIR=zones
