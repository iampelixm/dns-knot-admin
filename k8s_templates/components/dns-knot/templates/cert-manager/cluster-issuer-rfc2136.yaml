apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns-rfc2136
spec:
  acme:
    email: {{ACME_EMAIL}}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-dns-account-key
    solvers:
      - dns01:
          rfc2136:
            nameserver: {{DNS01_NAMESERVER}}
            tsigKeyName: certmanager-key
            tsigAlgorithm: HMACSHA256
            tsigSecretSecretRef:
              name: certmanager-tsig
              key: tsig.key
