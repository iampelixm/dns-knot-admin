# Патч Deployment cert-manager для DNS01.
# Скрипт deploy-dns-knot.sh применяет его стратегическим merge-патчем (kubectl patch),
# при этом существующие --dns01-recursive-nameservers флаги не дублируются.
#
# --dns01-recursive-nameservers=<knot-ip>:53   → проверять TXT напрямую у нашего Knot
# --dns01-recursive-nameservers-only           → не ходить в публичные резолверы
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  template:
    spec:
      containers:
        - name: cert-manager-controller
          args:
            - --dns01-recursive-nameservers={{DNS01_NAMESERVER}}
            - --dns01-recursive-nameservers-only
