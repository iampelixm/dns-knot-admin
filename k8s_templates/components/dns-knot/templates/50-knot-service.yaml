apiVersion: v1
kind: Service
metadata:
  name: knot
  namespace: {{NAMESPACE}}
  labels:
    app: knot
spec:
  selector:
    app: knot
    knot-instance: "{{DNS_PRIMARY_ID}}"
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
  type: ClusterIP
