apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dns-agent
  namespace: {{NAMESPACE}}
  labels:
    app: dns-agent
    app.kubernetes.io/part-of: dns-knot
spec:
  selector:
    matchLabels:
      app: dns-agent
  template:
    metadata:
      labels:
        app: dns-agent
        app.kubernetes.io/part-of: dns-knot
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        dns-server: "true"
      tolerations:
        - operator: Exists
      imagePullSecrets:
        - name: {{PULL_SECRET_NAME}}
      containers:
        - name: agent
          image: {{AGENT_IMAGE}}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AGENT_PORT
              value: "8080"
            - name: AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{AGENT_SECRET_NAME}}
                  key: api_key
          volumeMounts:
            - name: knot-config
              mountPath: /etc/knot
              readOnly: false
            - name: knot-data
              mountPath: /var/lib/knot
              readOnly: false
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: knot-config
          hostPath:
            path: /etc/knot
            type: DirectoryOrCreate
        - name: knot-data
          hostPath:
            path: /var/lib/knot
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Secret
metadata:
  name: {{AGENT_SECRET_NAME}}
  namespace: {{NAMESPACE}}
  labels:
    app: dns-agent
type: Opaque
stringData:
  api_key: "{{AGENT_API_KEY}}"