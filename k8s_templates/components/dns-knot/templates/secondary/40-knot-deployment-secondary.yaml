apiVersion: apps/v1
kind: Deployment
metadata:
  name: knot-{{INSTANCE_ID}}
  namespace: {{NAMESPACE}}
  labels:
    app: knot
    knot-instance: "{{INSTANCE_ID}}"
    knot-role: secondary
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: knot
      knot-instance: "{{INSTANCE_ID}}"
  template:
    metadata:
      labels:
        app: knot
        knot-instance: "{{INSTANCE_ID}}"
        knot-role: secondary
    spec:
      nodeName: {{NODE_NAME}}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: knot
          image: {{KNOT_IMAGE}}
          imagePullPolicy: IfNotPresent
          command:
            - knotd
          args:
            - -c
            - /etc/knot/knot.conf
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - knotc
                - status
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - knotc
                - status
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: knot-config
              mountPath: /etc/knot/knot.conf
              subPath: knot.conf
              readOnly: true
            - name: knot-axfr
              mountPath: /etc/knot/conf.d/axfr.conf
              subPath: axfr.conf
              readOnly: true
            - name: knot-data
              mountPath: /var/lib/knot
      volumes:
        - name: knot-config
          configMap:
            name: knot-config-{{INSTANCE_ID}}
        - name: knot-axfr
          secret:
            secretName: {{AXFR_SECRET_NAME}}
        - name: knot-data
          emptyDir: {}
